<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portail Pédagogique – Lycée Le Cleusmeur</title>
  <script src="https://kit.fontawesome.com/f6d42ea8e9.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      color: #2c2c2c;
    }

    /* ===== HEADER ===== */
    header {
      background: #494949;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .header-left h1 { font-size: 1.4rem; }
    .header-left p  { font-size: 0.85rem; opacity: 0.7; margin-top: 0.2rem; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: white;
      flex-shrink: 0;
    }

    .header-right:hover .lycee-nom { text-decoration: underline; }

    .lycee-nom {
      font-size: 0.9rem;
      font-weight: 600;
      text-align: right;
      line-height: 1.3;
      max-width: 160px;
    }

    .logo-cercle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.4);
    }

    .logo-cercle img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    /* ===== BARRE DE FILTRES ===== */
    #filtres {
      background: white;
      padding: 0.75rem 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    #filtres input,
    #filtres select {
      padding: 0.45rem 0.7rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.85rem;
      background: #f9f9f9;
    }

    #filtres input { flex: 1; min-width: 180px; }

    #btn-reset {
      padding: 0.45rem 1rem;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    #btn-reset:hover { background: #c0392b; }

    /* ===== MAIN ===== */
    main { padding: 2rem; }

    /* ===== SECTION DÉPLIANTE ===== */
    .section-bloc {
      margin-bottom: 2.5rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      cursor: pointer;
      user-select: none;
      border-bottom: 3px solid transparent;
      transition: background 0.2s;
    }

    .section-header:hover { background: #f0f3f6; }

    .section-header.apps    { border-color: #803977; }
    .section-header.outils  { border-color: #e63f01; }
    .section-header.structs { border-color: #028a85; }

    .section-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-header-left i {
      font-size: 1.3rem;
    }

    .section-header.apps    i { color: #803977; }
    .section-header.outils  i { color: #e63f01; }
    .section-header.structs i { color: #028a85; }

    .section-header h2 {
      font-size: 1.15rem;
      color: #2c3e50;
    }

    .section-header .badge {
      font-size: 0.75rem;
      background: #eee;
      color: #666;
      border-radius: 20px;
      padding: 0.15rem 0.6rem;
      margin-left: 0.5rem;
    }

    .fleche {
      font-size: 1rem;
      color: #888;
      transition: transform 0.3s;
    }

    .section-bloc.ferme .fleche { transform: rotate(-90deg); }

    /* ===== CONTENU DE SECTION ===== */
    .section-contenu {
      padding: 1.5rem;
    }

    .section-bloc.ferme .section-contenu { display: none; }

    /* ===== GRILLE DE CARTES ===== */
    .grille {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    /* ===== CARTE ===== */
    .carte {
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .carte-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .carte:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .carte.cachee { display: none; }

    .carte-icone {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: white;
      flex-shrink: 0;
    }

    .carte-icone img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .carte-icone.apps    { background: #ffffff; }
    .carte-icone.outils  { background: #ffffff; }
    .carte-icone.structs { background: #ffffff; }
    .carte-icone img     { width: 28px; height: 28px; object-fit: contain; }

    .carte-titre {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .carte-desc {
      font-size: 0.8rem;
      color: #666;
      flex: 1;
    }

    .carte-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.3rem;
    }

    .tag {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      background: #e8f0fe;
      color: #2c5fad;
    }

    .carte-niveaux {
      font-size: 0.72rem;
      color: #999;
    }

    .carte-image {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }

    .carte-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }


    /* ===== BOUTON AFFICHER PLUS ===== */
    .btn-plus-wrap {
      text-align: center;
      margin-top: 1rem;
    }

    .btn-plus {
      padding: 0.5rem 1.5rem;
      border: 2px solid #2c3e50;
      background: transparent;
      color: #2c3e50;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-plus:hover {
      background: #2c3e50;
      color: white;
    }

    .btn-plus.cache { display: none; }

    /* ===== MESSAGE VIDE ===== */
    .msg-vide {
      color: #aaa;
      font-style: italic;
      font-size: 0.9rem;
      padding: 0.5rem 0;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; }
      .header-right { align-self: flex-end; }
      .lycee-nom { display: none; }
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="header-left">
    <h1><i class="fas fa-graduation-cap"></i> Portail Pédagogique</h1>
    <p>Ressources interactives pour la classe</p>
  </div>

  <a class="header-right" href="https://lyceecleusmeur.net/" target="_blank" title="Site du lycée Le Cleusmeur">
    <span class="lycee-nom">Lycée Le Cleusmeur<br><small style="font-weight:400;opacity:0.8">Lesneven</small></span>
    <div class="logo-cercle">
      <img src="assets/icones/Logo_alone.svg" alt="Logo lycée Le Cleusmeur" />
    </div>
  </a>
</header>

<!-- ===== FILTRES ===== -->
<div id="filtres">
  <input type="text" id="recherche" placeholder="🔍 Rechercher...">
  <select id="filtre-matiere">
    <option value="">Toutes les matières</option>
    <option value="Biologie">Biologie</option>
    <option value="Biologie Humaine">Biologie Humaine</option>
    <option value="Ecologie">Écologie</option>
    <option value="Physique-Chimie">Physique-Chimie</option>
    <option value="Informatique">Informatique</option>
    <option value="SNT">SNT</option>
    <option value="TIM">TIM</option>
    <option value="Transversal">Transversal</option>
  </select>
  <select id="filtre-niveau">
    <option value="">Tous les niveaux</option>
    <option value="4ème">4ème</option>
    <option value="3ème">3ème</option>
    <option value="CAPa SAPVER">CAPa SAPVER</option>
    <option value="Bac Pro SAPAT">Bac Pro SAPAT</option>
  </select>
  <select id="filtre-type">
    <option value="">Tous les types</option>
    <option value="application">Applications</option>
    <option value="outil">Outils pédagogiques</option>
    <option value="structure">Structures pédagogiques</option>
  </select>
  <button id="btn-reset"><i class="fas fa-times"></i> Réinitialiser</button>
</div>

<!-- ===== CONTENU PRINCIPAL ===== -->
<main>
  <!-- SECTION OUTILS -->
  <div class="section-bloc" id="bloc-outils">
    <div class="section-header outils" onclick="toggleSection('bloc-outils')">
      <div class="section-header-left">
        <img src="assets\icones\Outils.gif" , style="width:32px; height:32px; vertical-align:middle;" alt="Outils">
        <h2>Outils pédagogiques <span class="badge" id="badge-outils">0</span></h2>
      </div>
      <i class="fas fa-chevron-down fleche"></i>
    </div>
    <div class="section-contenu">
      <div class="grille" id="grille-outils"></div>
      <div class="btn-plus-wrap">
        <button class="btn-plus cache" id="btn-plus-outils" onclick="afficherPlus('outils')">
          <i class="fas fa-plus"></i> Afficher plus
        </button>
      </div>
    </div>
  </div>

  <!-- SECTION APPLICATIONS -->
  <div class="section-bloc" id="bloc-apps">
    <div class="section-header apps" onclick="toggleSection('bloc-apps')">
      <div class="section-header-left">
        <img src="assets\icones\Applications.gif" , style="width:32px; height:32px; vertical-align:middle;" alt="Applications">
        <h2>Applications interactives <span class="badge" id="badge-apps">0</span></h2>
      </div>
      <i class="fas fa-chevron-down fleche"></i>
    </div>
    <div class="section-contenu">
      <div class="grille" id="grille-apps"></div>
      <div class="btn-plus-wrap">
        <button class="btn-plus cache" id="btn-plus-apps" onclick="afficherPlus('apps')">
          <i class="fas fa-plus"></i> Afficher plus
        </button>
      </div>
    </div>
  </div>

  <!-- SECTION STRUCTURES -->
  <div class="section-bloc" id="bloc-structs">
    <div class="section-header structs" onclick="toggleSection('bloc-structs')">
      <div class="section-header-left">
        <img src="assets\icones\Structures.gif" , style="width:32px; height:32px; vertical-align:middle;" alt="Structures">
        <h2>Structures pédagogiques <span class="badge" id="badge-structs">0</span></h2>
      </div>
      <i class="fas fa-chevron-down fleche"></i>
    </div>
    <div class="section-contenu">
      <div class="grille" id="grille-structs"></div>
      <div class="btn-plus-wrap">
        <button class="btn-plus cache" id="btn-plus-structs" onclick="afficherPlus('structs')">
          <i class="fas fa-plus"></i> Afficher plus
        </button>
      </div>
    </div>
  </div>

</main>

<script>
  // ── Configuration ────────────────────────────────────────────────────
  const VIGNETTES_INIT = 6;
  const VIGNETTES_STEP = 6;

  const SECTIONS = {
    apps:    { grille: 'grille-apps',    badge: 'badge-apps',    btnPlus: 'btn-plus-apps'    },
    outils:  { grille: 'grille-outils',  badge: 'badge-outils',  btnPlus: 'btn-plus-outils'  },
    structs: { grille: 'grille-structs', badge: 'badge-structs', btnPlus: 'btn-plus-structs' },
  };

  const TYPE_MAP = {
    apps:    'application',
    outils:  'outil',
    structs: 'structure',
  };

  // Stock global
  let donnees = { apps: [], outils: [], structs: [] };
  let visibles = { apps: VIGNETTES_INIT, outils: VIGNETTES_INIT, structs: VIGNETTES_INIT };

  // ── Chargement JSON ──────────────────────────────────────────────────
  async function charger() {
    const res  = await fetch('applications.json');
    const tout = await res.json();

    donnees.apps    = tout.filter(e => e.categorie === 'application');
    donnees.outils  = tout.filter(e => e.categorie === 'outil');
    donnees.structs = tout.filter(e => e.categorie === 'structure');

    rendreTout(donnees);
  }

  // ── Rendu complet ────────────────────────────────────────────────────
  function rendreTout(data) {
    rendreSection('apps',    data.apps);
    rendreSection('outils',  data.outils);
    rendreSection('structs', data.structs);
  }

  // ── Rendu d'une section ──────────────────────────────────────────────
  function rendreSection(cle, items) {
    const grille  = document.getElementById(SECTIONS[cle].grille);
    const badge   = document.getElementById(SECTIONS[cle].badge);
    const btnPlus = document.getElementById(SECTIONS[cle].btnPlus);

    grille.innerHTML = '';
    badge.textContent = items.length;

    if (items.length === 0) {
      grille.innerHTML = '<p class="msg-vide">Aucune ressource trouvée.</p>';
      btnPlus.classList.add('cache');
      return;
    }

    items.forEach((item, index) => {
      const carte = creerCarte(item, cle);
      if (index >= visibles[cle]) carte.classList.add('cachee');
      grille.appendChild(carte);
    });

    if (items.length > visibles[cle]) {
      btnPlus.classList.remove('cache');
    } else {
      btnPlus.classList.add('cache');
    }
  }

  // ── Création d'une carte ─────────────────────────────────────────────
function creerCarte(item, cle) {
    const a = document.createElement('a');
    a.className = 'carte';
    a.href = item.url || '#';
    if (item.url) a.target = '_blank';

    // ── Image de la carte ──────────────────────────────────────────
    const imageDiv = document.createElement('div');
    imageDiv.className = 'carte-image';
    if (item.image) {
      imageDiv.innerHTML = `<img src="${item.image}" alt="">`;
    }

    // ── Ligne : icône + titre ──────────────────────────────────────
    const headerDiv = document.createElement('div');
    headerDiv.className = 'carte-header';

    const iconeDiv = document.createElement('div');
    iconeDiv.className = `carte-icone ${cle}`;
    if (item.icone && item.icone.startsWith('fa')) {
      iconeDiv.innerHTML = `<i class="${item.icone}"></i>`;
    } else if (item.icone) {
      iconeDiv.innerHTML = `<img src="${item.icone}" alt="">`;
    } else {
      iconeDiv.innerHTML = `<i class="fas fa-file"></i>`;
    }

    const titre = document.createElement('div');
    titre.className = 'carte-titre';
    titre.textContent = item.titre || 'Sans titre';

    headerDiv.append(iconeDiv, titre);

    // ── Reste de la carte ──────────────────────────────────────────
    const desc = document.createElement('div');
    desc.className = 'carte-desc';
    desc.textContent = item.description || '';

    const tagsDiv = document.createElement('div');
    tagsDiv.className = 'carte-tags';
    (item.tags || []).forEach(t => {
      const span = document.createElement('span');
      span.className = 'tag';
      span.textContent = t;
      tagsDiv.appendChild(span);
    });

    const niveaux = document.createElement('div');
    niveaux.className = 'carte-niveaux';
    if (item.niveaux && item.niveaux.length) {
      niveaux.textContent = item.niveaux.join(' · ');
    }

    a.append(imageDiv, headerDiv, desc, tagsDiv, niveaux);
    return a;
  }


  // ── Afficher plus ────────────────────────────────────────────────────
  function afficherPlus(cle) {
    visibles[cle] += VIGNETTES_STEP;
    rendreSection(cle, filtrerDonnees(cle));
  }

  // ── Toggle section dépliante ─────────────────────────────────────────
  function toggleSection(id) {
    document.getElementById(id).classList.toggle('ferme');
  }

  // ── Filtrage ─────────────────────────────────────────────────────────
  function filtrerDonnees(cle) {
    const recherche = document.getElementById('recherche').value.toLowerCase().trim();
    const matiere   = document.getElementById('filtre-matiere').value;
    const niveau    = document.getElementById('filtre-niveau').value;
    const type      = document.getElementById('filtre-type').value;

    return donnees[cle].filter(e => {
      const texte       = [e.titre, e.description, ...(e.tags || [])].join(' ').toLowerCase();
      const okRecherche = !recherche || texte.includes(recherche);
      const okMatiere   = !matiere   || e.matiere === matiere;
      const okNiveau    = !niveau    || (e.niveaux && e.niveaux.includes(niveau));
      const okType      = !type      || e.type === TYPE_MAP[cle];
      return okRecherche && okMatiere && okNiveau && okType;
    });
  }

  function filtrer() {
    visibles = { apps: VIGNETTES_INIT, outils: VIGNETTES_INIT, structs: VIGNETTES_INIT };
    rendreSection('apps',    filtrerDonnees('apps'));
    rendreSection('outils',  filtrerDonnees('outils'));
    rendreSection('structs', filtrerDonnees('structs'));
  }

  // ── Écouteurs ────────────────────────────────────────────────────────
  document.getElementById('recherche').addEventListener('input',       filtrer);
  document.getElementById('filtre-matiere').addEventListener('change', filtrer);
  document.getElementById('filtre-niveau').addEventListener('change',  filtrer);
  document.getElementById('filtre-type').addEventListener('change',    filtrer);

  document.getElementById('btn-reset').addEventListener('click', () => {
    document.getElementById('recherche').value      = '';
    document.getElementById('filtre-matiere').value = '';
    document.getElementById('filtre-niveau').value  = '';
    document.getElementById('filtre-type').value    = '';
    visibles = { apps: VIGNETTES_INIT, outils: VIGNETTES_INIT, structs: VIGNETTES_INIT };
    rendreTout(donnees);
  });

  // ── Lancement ────────────────────────────────────────────────────────
  charger();
</script>


</body>
</html>
