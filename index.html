<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes applications pédagogiques</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f8;
      color: #333;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 2rem;
      text-align: center;
    }

    header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
    header p { opacity: 0.7; font-size: 0.95rem; }

    .filtres {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1.5rem 2rem;
      background: white;
      border-bottom: 1px solid #ddd;
      align-items: center;
    }

    .filtres input, .filtres select {
      padding: 0.5rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
      background: #fafafa;
    }

    .filtres input { flex: 1; min-width: 200px; }

    .grille {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
    }

    .carte {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .carte:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .carte-image {
      width: 100%;
      height: 160px;
      object-fit: contain;  /* ✅ proportions respectées, pas de recadrage */
      background: #e8ecf0;  /* fond visible si l'image ne remplit pas tout */
    }

    .carte-image-placeholder {
      width: 100%;
      height: 160px;
      background: #e8ecf0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #aaa;
    }

    .carte-corps {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .carte-titre {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2c3e50;
    }

    .carte-description {
      font-size: 0.85rem;
      color: #666;
      flex: 1;
    }

    .badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-weight: 500;
    }

    .badge-matiere { background: #dbeafe; color: #1e40af; }
    .badge-niveau  { background: #dcfce7; color: #166534; }

    .carte-lien {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      background: #2c3e50;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      text-align: center;
      transition: background 0.2s;
    }

    .carte-lien:hover { background: #3d5166; }

    .aucun-resultat {
      grid-column: 1 / -1;
      text-align: center;
      color: #999;
      font-size: 1rem;
      padding: 3rem;
    }
  </style>
</head>
<body>

<header>
  <h1><i class="fas fa-chalkboard-teacher"></i> Mes applications pédagogiques</h1>
  <p>Cliquez sur une application pour l'ouvrir</p>
</header>

<div class="filtres">
  <input type="text" id="recherche" placeholder="🔍 Rechercher une application...">
  <select id="filtreMatiere">
    <option value="">Toutes les matières</option>
  </select>
  <select id="filtreNiveau">
    <option value="">Tous les niveaux</option>
  </select>
  <select id="filtreModule">  <!-- ✅ Ajout -->
    <option value="">Tous les modules</option>
  </select>
</div>


<div class="grille" id="grille"></div>

<script>
  let applications = [];

  fetch('applications.json')
    .then(r => r.json())
    .then(data => {
      applications = data;
      peuplerFiltres(data);
      afficher(data);
    })
    .catch(() => {
      document.getElementById('grille').innerHTML =
        '<p class="aucun-resultat"><i class="fas fa-exclamation-triangle"></i> Impossible de charger applications.json</p>';
    });

function peuplerFiltres(data) {
  const matieres = [...new Set(data.map(a => a.matiere))].sort();
  const niveaux  = [...new Set(data.flatMap(a => a.niveaux))].sort();
  const modules  = [...new Set(data.map(a => a.module))].sort(); // ✅ Ajout

  const selM = document.getElementById('filtreMatiere');
  const selN = document.getElementById('filtreNiveau');
  const selMod = document.getElementById('filtreModule'); // ✅ Ajout

  matieres.forEach(m   => selM.innerHTML   += `<option value="${m}">${m}</option>`);
  niveaux.forEach(n    => selN.innerHTML   += `<option value="${n}">${n}</option>`);
  modules.forEach(mod  => selMod.innerHTML += `<option value="${mod}">${mod}</option>`); // ✅ Ajout
}


function afficher(data) {
  const grille = document.getElementById('grille');
  grille.innerHTML = '';

  if (data.length === 0) {
    grille.innerHTML = '<p class="aucun-resultat"><i class="fas fa-search"></i> Aucune application trouvée</p>';
    return;
  }

  data.forEach((app, index) => {
    const placeholderId = `placeholder-${index}`; // ✅ ID unique

    const vignette = app.image
      ? `<img class="carte-image" src="${app.image}" alt="${app.titre}" 
            onerror="this.style.display='none';document.getElementById('${placeholderId}').style.display='flex'">
         <div class="carte-image-placeholder" id="${placeholderId}" style="display:none">${app.emoji || '📁'}</div>`
      : `<div class="carte-image-placeholder">${app.emoji || '📁'}</div>`;

    grille.innerHTML += `
      <div class="carte">
        ${vignette}
        <div class="carte-corps">
          <div class="carte-titre">${app.titre}</div>
          <div class="badges">
            <span class="badge badge-matiere">${app.matiere}</span>
            ${app.niveaux.map(n => `<span class="badge badge-niveau">${n}</span>`).join('')} <!-- ✅ boucle sur niveaux -->
          </div>
          <div class="carte-description">${app.description}</div>
          <a class="carte-lien" href="${app.url}" target="_blank">
            <i class="fas fa-external-link-alt"></i> Ouvrir
          </a>
        </div>
      </div>`;
  });
}

function filtrer() {
  const texte   = document.getElementById('recherche').value.toLowerCase();
  const matiere = document.getElementById('filtreMatiere').value;
  const niveau  = document.getElementById('filtreNiveau').value;
  const module_ = document.getElementById('filtreModule').value; // ✅ Ajout

  const resultat = applications.filter(a =>
    (!matiere  || a.matiere === matiere) &&
    (!niveau   || a.niveaux.includes(niveau)) &&
    (!module_  || a.module === module_) && // ✅ Ajout
    (!texte    || a.titre.toLowerCase().includes(texte) || a.description.toLowerCase().includes(texte))
  );

  afficher(resultat);
}



document.getElementById('recherche').addEventListener('input', filtrer);
document.getElementById('filtreMatiere').addEventListener('change', filtrer);
document.getElementById('filtreNiveau').addEventListener('change', filtrer);
document.getElementById('filtreModule').addEventListener('change', filtrer); // ✅ Ajout
</script>

</body>
</html>
