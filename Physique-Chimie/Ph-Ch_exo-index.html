<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physique-Chimie · Missions collège</title>
  <meta name="description" content="Jeu d'exercices de physique-chimie pour le collège.">
  <link rel="stylesheet" href="../assets/css/Ph-Ch_exo-style.css">
  <script src="../assets/js/Ph-Ch_exo-app.js" defer></script>

<body>
  <header class="entete conteneur">
    <div class="surtitre">Laboratoire des curiosités · collège</div>
    <h1>Physique-Chimie,<br><em>à toi de jouer.</em></h1>
    <p class="introduction">Choisis un chapitre, une catégorie, puis un thème que tu aimes, et réponds à la question avec tes propres mots.</p>

  <main class="conteneur" id="app">
    <section id="chapitres-container" class="panneau" aria-label="Choisir un chapitre"></section>

    <section id="tags-container" class="panneau" style="display:none" aria-label="Choisir une catégorie"></section>
    <section id="themes-container" class="panneau" style="display:none" aria-label="Choisir un thème"></section>
    <section id="exercice-container" class="panneau" style="display:none" aria-label="Exercice"></section>
  </main>
  <footer class="pied conteneur">Un support simple pour observer, comprendre et expliquer.</footer>
