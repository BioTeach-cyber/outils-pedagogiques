<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Transfert lit → fauteuil</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f0;
      min-height: 100vh;
    }

    header {
      background: #2e7d32;
      color: white;
      padding: 20px;
      text-align: center;
    }

    #app { max-width: 600px; margin: 0 auto; padding: 20px; }

    /* ZONE ANIMATION CENTRALE */
    #zone-animation {
      background: white;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      position: relative;
    }

    #lottie-container {
      width: 200px;
      height: 200px;
      margin: 0 auto;
    }

    #etape-titre {
      font-size: 1.3em;
      font-weight: bold;
      color: #2e7d32;
      margin: 15px 0 5px;
    }

    #etape-sous-titre {
      color: #888;
      font-size: 0.9em;
    }

    /* PASTILLES D'ÉTAPES */
    #pastilles {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 15px 0;
    }
    .pastille {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ddd;
      transition: all 0.3s;
    }
    .pastille.active { background: #2e7d32; transform: scale(1.3); }
    .pastille.done { background: #66bb6a; }

    /* CONTENU ÉTAPE */
    #zone-contenu {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 15px;
      animation: slideIn 0.4s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    #zone-contenu ul { list-style: none; }
    #zone-contenu li {
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    #zone-contenu li:last-child { border-bottom: none; }
    .icone-item { font-size: 1.2em; flex-shrink: 0; }

    .vigilance {
      background: #fff3e0;
      border-left: 4px solid #ff9800;
      padding: 10px 15px;
      margin-top: 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.85em;
    }

    /* BOUTONS NAVIGATION */
    #navigation {
      display: flex;
      gap: 10px;
    }
    .btn-nav {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.2s;
    }
    #btn-precedent {
      background: #e0e0e0;
      color: #555;
    }
    #btn-suivant {
      background: #2e7d32;
      color: white;
      font-weight: bold;
    }
    #btn-suivant:hover { background: #1b5e20; transform: translateY(-1px); }
    #btn-precedent:disabled { opacity: 0.3; cursor: not-allowed; }

    /* FEEDBACK ANIMATION VALIDÉ */
    #feedback {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 150px; height: 150px;
      pointer-events: none;
      display: none;
      z-index: 999;
    }

    /* FIN */
    #ecran-fin {
      display: none;
      text-align: center;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    #lottie-fin { width: 180px; height: 180px; margin: 0 auto; }
    #ecran-fin h2 { color: #2e7d32; margin: 15px 0 10px; }
    .btn-recommencer {
      margin-top: 20px;
      padding: 12px 30px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>🛏️ → 🪑 Transfert lit → fauteuil</h1>
</header>

<div id="app">

  <!-- ZONE ANIMATION + TITRE -->
  <div id="zone-animation">
    <div id="pastilles"></div>
    <div id="lottie-container"></div>
    <div id="etape-titre"></div>
    <div id="etape-sous-titre"></div>
  </div>

  <!-- CONTENU -->
  <div id="zone-contenu"></div>

  <!-- NAVIGATION -->
  <div id="navigation">
    <button class="btn-nav" id="btn-precedent" onclick="etapePrecedente()" disabled>← Retour</button>
    <button class="btn-nav" id="btn-suivant" onclick="etapeSuivante()">Suivant →</button>
  </div>

  <!-- FIN -->
  <div id="ecran-fin">
    <div id="lottie-fin"></div>
    <h2>Protocole terminé ! 🎉</h2>
    <p>Toutes les étapes ont été réalisées avec succès.</p>
    <button class="btn-recommencer" onclick="location.reload()">🔄 Recommencer</button>
  </div>

  <!-- FEEDBACK -->
  <div id="feedback"></div>

</div>

<script>
  // ============================================================
  // DONNÉES DES ÉTAPES
  // Chaque étape utilise une animation Lottie différente
  // via des URLs d'animations publiques LottieFiles
  // ============================================================
  const etapes = [
    {
      titre: "Préparer l'environnement",
      sousTitre: "Fauteuil, lit, matériel",
      // Animation : outils / préparation
      lottieUrl: "https://assets10.lottiefiles.com/packages/lf20_touohxv0.json",
      items: [
        { icone: "🪑", texte: "Placer le fauteuil à 45° du lit, côté membre fort" },
        { icone: "🔒", texte: "Verrouiller les deux roues du fauteuil" },
        { icone: "👣", texte: "Retirer les repose-pieds" },
        { icone: "🛏️", texte: "Activer le frein du lit" },
        { icone: "📏", texte: "Régler la hauteur du lit au niveau des genoux" }
      ],
      vigilance: "⚠️ Ne jamais laisser le patient seul"
    },
    {
      titre: "Asseoir le patient",
      sousTitre: "Mise en position assise en bord de lit",
      // Animation : personne assise / mouvement
      lottieUrl: "https://assets3.lottiefiles.com/packages/lf20_qm8eqzse.json",
      items: [
        { icone: "⬆️", texte: "Relever la tête de lit à 90°" },
        { icone: "↩️", texte: "Tourner le patient sur le côté" },
        { icone: "🦵", texte: "Faire descendre les jambes hors du lit" },
        { icone: "🧍", texte: "Aider à redresser le buste" },
        { icone: "⏱️", texte: "Laisser assis 1 à 2 minutes avant de continuer" }
      ],
      vigilance: "⚠️ Observer vertiges, pâleur, sueurs = hypotension orthostatique"
    },
    {
      titre: "Préparer le transfert",
      sousTitre: "Chaussage et positionnement du soignant",
      // Animation : checklist / vérification
      lottieUrl: "https://assets2.lottiefiles.com/packages/lf20_5tkzkblw.json",
      items: [
        { icone: "👟", texte: "Mettre les chaussures antidérapantes" },
        { icone: "✅", texte: "Vérifier les pieds bien à plat au sol" },
        { icone: "🧑‍⚕️", texte: "Se placer face au patient, pieds écartés" },
        { icone: "🦾", texte: "Genoux fléchis, dos droit" },
        { icone: "🎗️", texte: "Installer la ceinture de transfert si disponible" }
      ],
      vigilance: "⚠️ Ne jamais saisir sous les aisselles"
    },
    {
      titre: "Effectuer le transfert",
      sousTitre: "Lever, pivot et assise",
      // Animation : mouvement / transfert
      lottieUrl: "https://assets4.lottiefiles.com/packages/lf20_uwR49r.json",
      items: [
        { icone: "🗣️", texte: "Annoncer le mouvement : \"On se lève ensemble\"" },
        { icone: "⬆️", texte: "Aider à se lever en douceur" },
        { icone: "🔄", texte: "Faire pivoter vers le fauteuil" },
        { icone: "🎯", texte: "Vérifier l'alignement avec le fauteuil" },
        { icone: "⬇️", texte: "Descendre lentement et en contrôle" }
      ],
      vigilance: "⚠️ Garder le dos droit durant tout le mouvement"
    },
    {
      titre: "Installer et tracer",
      sousTitre: "Confort du patient et traçabilité",
      // Animation : validation / succès
      lottieUrl: "https://assets9.lottiefiles.com/packages/lf20_jbrw3hcz.json",
      items: [
        { icone: "👣", texte: "Replacer les repose-pieds" },
        { icone: "🦴", texte: "Vérifier l'alignement du bassin" },
        { icone: "🔔", texte: "Installer la sonnette à portée" },
        { icone: "💬", texte: "Demander si le patient est confortable" },
        { icone: "📋", texte: "Noter l'heure, le comportement, tout incident" }
      ],
      vigilance: null
    }
  ];

  let etapeActuelle = 0;
  let animCourante = null;

  // ============================================================
  // INITIALISATION
  // ============================================================
  function init() {
    // Créer les pastilles
    const pastilles = document.getElementById('pastilles');
    etapes.forEach((_, i) => {
      const p = document.createElement('div');
      p.className = 'pastille';
      p.id = `pastille-${i}`;
      pastilles.appendChild(p);
    });

    afficherEtape(0);
  }

  // ============================================================
  // AFFICHER UNE ÉTAPE
  // ============================================================
  function afficherEtape(n) {
    const etape = etapes[n];

    // Mettre à jour pastilles
    etapes.forEach((_, i) => {
      const p = document.getElementById(`pastille-${i}`);
      p.className = 'pastille';
      if (i < n) p.classList.add('done');
      if (i === n) p.classList.add('active');
    });

    // Titre et sous-titre
    document.getElementById('etape-titre').textContent = `${n+1}. ${etape.titre}`;
    document.getElementById('etape-sous-titre').textContent = etape.sousTitre;

    // Charger l'animation Lottie
    if (animCourante) animCourante.destroy();
    const container = document.getElementById('lottie-container');
    container.innerHTML = '';

    animCourante = lottie.loadAnimation({
      container: container,
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: etape.lottieUrl
    });

    // Contenu
    const zone = document.getElementById('zone-contenu');
    zone.style.animation = 'none';
    zone.offsetHeight; // reflow pour relancer l'animation CSS
    zone.style.animation = '';

    let html = '<ul>';
    etape.items.forEach(item => {
      html += `<li><span class="icone-item">${item.icone}</span>${item.texte}</li>`;
    });
    html += '</ul>';
    if (etape.vigilance) {
      html += `<div class="vigilance">${etape.vigilance}</div>`;
    }
    zone.innerHTML = html;

    // Boutons
    document.getElementById('btn-precedent').disabled = (n === 0);
    document.getElementById('btn-suivant').textContent =
      n === etapes.length - 1 ? 'Terminer ✅' : 'Suivant →';
  }

  // ============================================================
  // NAVIGATION
  // ============================================================
  function etapeSuivante() {
    jouerFeedback();
    setTimeout(() => {
      if (etapeActuelle < etapes.length - 1) {
        etapeActuelle++;
        afficherEtape(etapeActuelle);
      } else {
        afficherFin();
      }
    }, 600);
  }

  function etapePrecedente() {
    if (etapeActuelle > 0) {
      etapeActuelle--;
      afficherEtape(etapeActuelle);
    }
  }

  // ============================================================
  // FEEDBACK ANIMÉ (validation)
  // ============================================================
  function jouerFeedback() {
    const fb = document.getElementById('feedback');
    fb.style.display = 'block';
    fb.innerHTML = '';

    lottie.loadAnimation({
      container: fb,
      renderer: 'svg',
      loop: false,
      autoplay: true,
      // Animation checkmark / validation
      path: 'https://assets3.lottiefiles.com/packages/lf20_jz0kanwc.json'
    });

    setTimeout(() => {
      fb.style.display = 'none';
      fb.innerHTML = '';
    }, 1500);
  }

  // ============================================================
  // ÉCRAN FIN
  // ============================================================
  function afficherFin() {
    if (animCourante) animCourante.destroy();
    document.getElementById('zone-animation').style.display = 'none';
    document.getElementById('zone-contenu').style.display = 'none';
    document.getElementById('navigation').style.display = 'none';
    document.getElementById('ecran-fin').style.display = 'block';

    lottie.loadAnimation({
      container: document.getElementById('lottie-fin'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: 'https://assets3.lottiefiles.com/packages/lf20_pqnfmone.json'
    });
  }

  // Lancer
  init();
</script>
</body>
</html>
