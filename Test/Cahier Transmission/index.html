<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tableau de bord — Situations d'apprentissage</title>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #2d3748;
    }

    header {
      background: #2b6cb0;
      color: white;
      padding: 1.5rem 2rem;
    }
    header h1 { font-size: 1.5rem; }
    header p  { font-size: 0.9rem; opacity: 0.85; margin-top: 0.3rem; }

    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* SECTION */
    .section {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .section h2 {
      font-size: 1.1rem;
      color: #2b6cb0;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #ebf4ff;
    }

    /* MOTEUR DE RECHERCHE */
    .recherche-barre {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .recherche-barre input {
      flex: 1;
      padding: 0.6rem 1rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      background: #f7fafc;
    }

    .recherche-barre input:focus {
      outline: none;
      border-color: #2b6cb0;
      background: white;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-bleu   { background: #2b6cb0; color: white; }
    .btn-gris   { background: #e2e8f0; color: #4a5568; }

    .compteur {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 1rem;
    }

    /* CARTE RÉSULTAT */
    .carte-resultat {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      background: #f7fafc;
      transition: box-shadow 0.2s;
    }

    .carte-resultat:hover {
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .carte-resultat.urgente {
      border-left: 4px solid #e53e3e;
      background: #fff5f5;
    }

    .carte-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .resident-nom {
      font-weight: 700;
      font-size: 1rem;
      color: #2d3748;
    }

    .badges {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .badge {
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-categorie { background: #ebf4ff; color: #2b6cb0; }
    .badge-urgence   { background: #e53e3e; color: white; }
    .badge-date      { background: #e2e8f0; color: #4a5568; }

    .transmission-texte {
      font-size: 0.9rem;
      color: #4a5568;
      line-height: 1.5;
    }

    .transmission-texte mark {
      background: #fefcbf;
      color: #744210;
      border-radius: 3px;
      padding: 0 2px;
    }

    .source-fichier {
      font-size: 0.78rem;
      color: #a0aec0;
      margin-top: 0.4rem;
    }

    /* SITUATIONS D'APPRENTISSAGE */
    .sa-grille {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .sa-carte {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      background: #f7fafc;
      transition: box-shadow 0.2s;
    }

    .sa-carte:hover {
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .sa-titre {
      font-weight: 700;
      font-size: 0.95rem;
      color: #2d3748;
      margin-bottom: 0.3rem;
    }

    .sa-desc {
      font-size: 0.83rem;
      color: #718096;
      margin-bottom: 0.75rem;
      line-height: 1.4;
    }

    .sa-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.75rem;
    }

    .sa-tag {
      background: #ebf4ff;
      color: #2b6cb0;
      font-size: 0.72rem;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      font-weight: 600;
    }

    .sa-lien {
      display: inline-block;
      padding: 0.4rem 0.9rem;
      background: #2b6cb0;
      color: white;
      border-radius: 8px;
      font-size: 0.83rem;
      text-decoration: none;
      font-weight: 600;
    }

    .sa-lien:hover { background: #2c5282; }

    .vide {
      text-align: center;
      color: #a0aec0;
      padding: 2rem;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>

<header>
  <h1>📋 Tableau de bord — Ressources pédagogiques</h1>
  <p>Bac Pro SAPAT — Usage enseignant</p>
</header>

<div class="container" x-data="dashboard()">

  <!-- MOTEUR DE RECHERCHE -->
  <div class="section">
    <h2>🔍 Recherche dans les cahiers de transmissions</h2>

    <div class="recherche-barre">
      <input
        type="text"
        x-model="motCle"
        @keyup.enter="rechercher()"
        placeholder="Ex : escarre, chute, refus, douleur, alimentation..."
      />
      <button class="btn btn-bleu" @click="rechercher()">Rechercher</button>
      <button class="btn btn-gris" @click="reinitialiser()">Effacer</button>
    </div>

    <!-- RÉSULTATS -->
    <template x-if="rechercheLancee">
      <div>
        <p class="compteur">
          <strong x-text="resultats.length"></strong> transmission(s) trouvée(s)
          pour <em x-text="'« ' + motCleActif + ' »'"></em>
        </p>

        <template x-if="resultats.length === 0">
          <p class="vide">Aucune transmission ne contient ce mot-clé.</p>
        </template>

        <template x-for="r in resultats" :key="r.id">
          <div class="carte-resultat" :class="r.urgence ? 'urgente' : ''">
            <div class="carte-top">
              <span class="resident-nom" x-text="r.resident"></span>
              <div class="badges">
                <span class="badge badge-date"     x-text="r.date"></span>
                <span class="badge badge-categorie" x-text="r.categorie"></span>
                <template x-if="r.urgence">
                  <span class="badge badge-urgence">⚠ Urgent</span>
                </template>
              </div>
            </div>
            <p class="transmission-texte" x-html="surlignerMotCle(r.transmission)"></p>
            <p class="source-fichier">📂 Source : <span x-text="r._source"></span></p>
          </div>
        </template>
      </div>
    </template>

    <template x-if="!rechercheLancee">
      <p class="vide">Tapez un mot-clé et lancez la recherche.</p>
    </template>
  </div>

  <!-- SITUATIONS D'APPRENTISSAGE -->
  <div class="section">
    <h2>📚 Situations d'apprentissage disponibles</h2>

    <div class="sa-grille">
      <template x-for="sa in situations" :key="sa.id">
        <div class="sa-carte">
          <p class="sa-titre" x-text="sa.titre"></p>
          <p class="sa-desc"  x-text="sa.description"></p>
          <div class="sa-tags">
            <template x-for="tag in sa.tags" :key="tag">
              <span class="sa-tag" x-text="tag"></span>
            </template>
          </div>
          <a :href="sa.lien" class="sa-lien" target="_blank">Ouvrir →</a>
        </div>
      </template>
    </div>

  </div>

</div><!-- /container -->

<script>
function dashboard() {
  return {
    motCle:        '',
    motCleActif:   '',
    rechercheLancee: false,
    resultats:     [],
    situations:    [],
    toutesTransmissions: [],

    // -------------------------------------------------------
    // LISTE DE VOS SITUATIONS D'APPRENTISSAGE
    // Ajoutez / modifiez ici vos SA
    // -------------------------------------------------------
    listeSituations: [
      {
        id: 1,
        titre: "Les transmissions ciblées — EHPAD Les Quatre Saisons",
        description: "Lecture et analyse d'un cahier de transmissions. Identification des besoins des résidents.",
        tags: ["transmissions", "EHPAD", "observation", "CAPa SAPVER"],
        lien: "transmissions.html"
      },
      {
        id: 2,
        titre: "Exemple SA 2",
        description: "Description de votre deuxième situation d'apprentissage.",
        tags: ["tag1", "tag2"],
        lien: "sa2.html"
      }
      // Ajoutez vos SA ici...
    ],

    // -------------------------------------------------------
    // LISTE DE VOS FICHIERS JSON DE TRANSMISSIONS
    // Ajoutez ici tous vos fichiers JSON
    // -------------------------------------------------------
    fichiers: [
      { nom: "transmissions.json", label: "EHPAD Les Quatre Saisons" },
      // { nom: "transmissions-foyer.json", label: "Foyer de vie" },
      // Ajoutez vos autres fichiers ici...
    ],

    async init() {
      this.situations = this.listeSituations;
      await this.chargerToutesTransmissions();
    },

    async chargerToutesTransmissions() {
      for (const fichier of this.fichiers) {
        try {
          const res  = await fetch(fichier.nom);
          const data = await res.json();
          const enrichies = data.transmissions.map(t => ({
            ...t,
            _source: fichier.label
          }));
          this.toutesTransmissions.push(...enrichies);
        } catch(e) {
          console.warn('Impossible de charger ' + fichier.nom, e);
        }
      }
    },

rechercher() {
  const mot = this.motCle.trim().toLowerCase();
  if (!mot) return;

  this.motCleActif     = this.motCle.trim();
  this.rechercheLancee = true;

  this.resultats = this.toutesTransmissions.filter(t =>
    (t.contenu   && t.contenu.toLowerCase().includes(mot))   ||
    (t.resident  && t.resident.toLowerCase().includes(mot))  ||
    (t.categorie && t.categorie.toLowerCase().includes(mot)) ||
    (t.auteur    && t.auteur.toLowerCase().includes(mot))
  );
},

    surlignerMotCle(texte) {
      if (!this.motCleActif) return texte;
      const regex = new RegExp('(' + this.motCleActif + ')', 'gi');
      return texte.replace(regex, '<mark>$1</mark>');
    },

    reinitialiser() {
      this.motCle          = '';
      this.motCleActif     = '';
      this.rechercheLancee = false;
      this.resultats       = [];
    }
  }
}
</script>

</body>
</html>
