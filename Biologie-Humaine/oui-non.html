<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oui / Non - Débats en classe</title>
<style>
  /* ============ VARIABLES ============ */
  :root {
    --bleu: #53a4db;
    --vert: #7fbc48;
    --violet: #a6539b;
    --orange: #f3912b;
    --gris: #b7b7b7;
    --rouge: #e62d32;
    --rose: #ee7bab;
    --jaune: #f4d32e;
    --marron: #a5706c;
    --noir: #494949;
    --fond: #ffffff;
  }

  /* ============ RESET & BASE ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--fond);
    color: var(--noir);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.5;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: clamp(1rem, 3vw, 2rem);
  }

  /* ============ ÉCRANS ============ */
  .ecran {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
  }
  .ecran.actif { display: flex; }

  /* ============ ACCUEIL ============ */
  h1 {
    color: var(--bleu);
    font-size: clamp(1.6rem, 4vw, 2.5rem);
    margin-bottom: 0.5rem;
    text-align: center;
  }
  .sous-titre {
    color: var(--noir);
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    margin-bottom: 2rem;
    text-align: center;
    opacity: 0.8;
  }
  .formulaire {
    background: #f7fbfe;
    border: 2px solid var(--bleu);
    border-radius: 16px;
    padding: clamp(1.2rem, 3vw, 2rem);
    width: 100%;
    max-width: 600px;
  }
  .champ {
    margin-bottom: 1.2rem;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: var(--noir);
    font-size: 1.05rem;
  }
  select, input[type="number"] {
    width: 100%;
    padding: 0.8rem 1rem;
    font-size: 1.05rem;
    border: 2px solid var(--gris);
    border-radius: 10px;
    background: white;
    color: var(--noir);
    font-family: inherit;
  }
  select:focus, input[type="number"]:focus {
    outline: none;
    border-color: var(--bleu);
  }

  /* ============ BOUTONS ============ */
  .btn {
    display: inline-block;
    padding: 0.9rem 1.6rem;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;
    text-align: center;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
  .btn:active { transform: translateY(0); }
  .btn-principal { background: var(--bleu); color: white; width: 100%; padding: 1rem; font-size: 1.15rem; margin-top: 0.5rem; }
  .btn-secondaire { background: var(--gris); color: white; }
  .btn-orange { background: var(--orange); color: white; }
  .btn-violet { background: var(--violet); color: white; }

  /* ============ QUESTION ============ */
  .categorie-affichee {
    display: inline-block;
    background: var(--bleu);
    color: white;
    padding: 0.4rem 1rem;
    border-radius: 20px;
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .question-texte {
    font-size: clamp(1.4rem, 3.5vw, 2.2rem);
    font-weight: 700;
    color: var(--noir);
    text-align: center;
    margin-bottom: 2rem;
    line-height: 1.3;
    max-width: 900px;
  }
  .ouinon-zone {
    display: flex;
    gap: 2rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ouinon {
    width: clamp(120px, 18vw, 180px);
    height: clamp(120px, 18vw, 180px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 800;
    color: white;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    user-select: none;
  }
  .oui { background: var(--vert); }
  .non { background: var(--rouge); }

  /* ============ TIMER ============ */
  .timer-zone {
    margin: 1rem 0 1.5rem;
    text-align: center;
    width: 100%;
    max-width: 500px;
  }
  .timer-affichage {
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 800;
    color: var(--bleu);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .timer-affichage.alerte { color: var(--orange); }
  .timer-affichage.fini { color: var(--rouge); animation: clignote 0.6s infinite; }
  @keyframes clignote { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .barre-progression {
    width: 100%;
    height: 12px;
    background: #eee;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 0.6rem;
  }
  .barre-progression-remplissage {
    height: 100%;
    background: var(--bleu);
    width: 100%;
    transition: width 0.5s linear, background-color 0.3s;
  }

  /* ============ CONTRÔLES ============ */
  .controles {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 1rem;
    width: 100%;
    max-width: 900px;
  }
  .controles .btn { flex: 1 1 auto; min-width: 160px; }

  /* ============ FICHE EXPLOITATION ============ */
  .fiche {
    display: none;
    margin-top: 1.5rem;
    padding: 1.2rem 1.5rem;
    background: #fdf6ec;
    border-left: 6px solid var(--orange);
    border-radius: 10px;
    width: 100%;
    max-width: 900px;
    text-align: left;
  }
  .fiche.visible { display: block; }
  .fiche h3 {
    color: var(--orange);
    margin-bottom: 0.4rem;
    font-size: 1.15rem;
  }
  .fiche h3:not(:first-child) { margin-top: 1rem; }
  .fiche p, .fiche li { font-size: 1rem; color: var(--noir); }
  .fiche ul { padding-left: 1.5rem; margin-top: 0.3rem; }
  .fiche .raisonnement {
    display: inline-block;
    background: var(--violet);
    color: white;
    padding: 0.3rem 0.8rem;
    border-radius: 15px;
    font-size: 0.9rem;
    font-weight: 600;
    margin-top: 0.4rem;
  }

  /* ============ MESSAGES ============ */
  .message-erreur {
    background: var(--rouge);
    color: white;
    padding: 1rem;
    border-radius: 10px;
    margin-bottom: 1rem;
    text-align: center;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 500px) {
    .ouinon-zone { gap: 1rem; }
    .controles .btn { min-width: 100%; }
  }
</style>
</head>
<body>

<!-- ========== ÉCRAN ACCUEIL ========== -->
<section id="ecran-accueil" class="ecran actif">
  <h1>Oui / Non&nbsp;: à toi de débattre&nbsp;!</h1>
  <p class="sous-titre">Choisis une catégorie, lance le timer, et défends ton point de vue.</p>

  <div id="zone-erreur"></div>

  <div class="formulaire">
    <div class="champ">
      <label for="select-categorie">Catégorie</label>
      <select id="select-categorie">
        <option value="__toutes__">🎲 Toutes les catégories (aléatoire)</option>
      </select>
    </div>

    <div class="champ">
      <label for="input-timer">Durée du débat (en secondes)</label>
      <input type="number" id="input-timer" value="60" min="5" max="600" step="5">
    </div>

    <button id="btn-demarrer" class="btn btn-principal">▶ Lancer une question</button>
  </div>
</section>

<!-- ========== ÉCRAN QUESTION ========== -->
<section id="ecran-question" class="ecran">
  <span id="categorie-affichee" class="categorie-affichee">Catégorie</span>
  <h2 id="question-texte" class="question-texte">Question…</h2>

  <div class="ouinon-zone" aria-hidden="true">
    <div class="ouinon oui">OUI</div>
    <div class="ouinon non">NON</div>
  </div>

  <div class="timer-zone">
    <div id="timer-affichage" class="timer-affichage">60</div>
    <div class="barre-progression">
      <div id="barre-remplissage" class="barre-progression-remplissage"></div>
    </div>
  </div>

  <div class="controles">
    <button id="btn-relancer-timer" class="btn btn-orange">⏱ Relancer le timer</button>
    <button id="btn-fiche" class="btn btn-violet">📖 Fiche d'exploitation</button>
    <button id="btn-suivante" class="btn btn-principal" style="width:auto;">➡ Question suivante</button>
    <button id="btn-retour" class="btn btn-secondaire">🏠 Accueil</button>
  </div>

  <div id="fiche-exploitation" class="fiche" aria-hidden="true">
    <h3>Réponse scientifique</h3>
    <p id="fiche-reponse"></p>

    <h3>Notions clés</h3>
    <ul id="fiche-notions"></ul>

    <h3>Pistes de débat</h3>
    <ul id="fiche-pistes"></ul>

    <h3>Type de raisonnement</h3>
    <span id="fiche-raisonnement" class="raisonnement"></span>
  </div>
</section>

<script>
"use strict";

/* ============================================================
   APPLICATION OUI / NON
   ============================================================ */

// Données chargées depuis le JSON
let donnees = null;
let categorieChoisie = "__toutes__";
let dureeTimer = 60;
let questionEnCours = null;
let derniereQuestionId = null;

// Timer
let intervalleTimer = null;
let secondesRestantes = 0;

/* ----------- SÉLECTEURS ----------- */
const selectCategorie = document.getElementById("select-categorie");
const inputTimer = document.getElementById("input-timer");
const btnDemarrer = document.getElementById("btn-demarrer");
const zoneErreur = document.getElementById("zone-erreur");

const ecranAccueil = document.getElementById("ecran-accueil");
const ecranQuestion = document.getElementById("ecran-question");

const categorieAffichee = document.getElementById("categorie-affichee");
const questionTexte = document.getElementById("question-texte");
const timerAffichage = document.getElementById("timer-affichage");
const barreRemplissage = document.getElementById("barre-remplissage");

const btnRelancerTimer = document.getElementById("btn-relancer-timer");
const btnFiche = document.getElementById("btn-fiche");
const btnSuivante = document.getElementById("btn-suivante");
const btnRetour = document.getElementById("btn-retour");

const ficheZone = document.getElementById("fiche-exploitation");
const ficheReponse = document.getElementById("fiche-reponse");
const ficheNotions = document.getElementById("fiche-notions");
const fichePistes = document.getElementById("fiche-pistes");
const ficheRaisonnement = document.getElementById("fiche-raisonnement");

/* ----------- CHARGEMENT JSON ----------- */
async function chargerDonnees() {
  try {
    const reponse = await fetch("../assets/json/Oui_non.json");
    if (!reponse.ok) throw new Error("Fichier introuvable (HTTP " + reponse.status + ")");
    donnees = await reponse.json();
    remplirCategories();
  } catch (erreur) {
    afficherErreur("Impossible de charger les questions : " + erreur.message
      + "<br>Vérifie que le fichier <b>./assets/json/Oui_non.json</b> existe bien.");
    btnDemarrer.disabled = true;
  }
}

function afficherErreur(message) {
  zoneErreur.innerHTML = '<div class="message-erreur">' + message + '</div>';
}

/* ----------- REMPLIR LE SELECT DES CATÉGORIES ----------- */
function remplirCategories() {
  if (!donnees || !donnees.categories) return;
  donnees.categories.forEach(function (cat) {
    const option = document.createElement("option");
    option.value = cat;
    option.textContent = cat;
    selectCategorie.appendChild(option);
  });
}

/* ----------- TIRER UNE QUESTION AU HASARD ----------- */
function tirerQuestionAleatoire() {
  if (!donnees || !donnees.questions || donnees.questions.length === 0) return null;

  let pool = donnees.questions;
  if (categorieChoisie !== "__toutes__") {
    pool = pool.filter(function (q) { return q.categorie === categorieChoisie; });
  }
  if (pool.length === 0) return null;

  // Éviter de retomber sur la même question deux fois de suite (si possible)
  if (pool.length > 1 && derniereQuestionId !== null) {
    pool = pool.filter(function (q) { return q.id !== derniereQuestionId; });
  }

  const choix = pool[Math.floor(Math.random() * pool.length)];
  derniereQuestionId = choix.id;
  return choix;
}

/* ----------- AFFICHER UNE QUESTION ----------- */
function afficherQuestion(question) {
  if (!question) {
    afficherErreur("Aucune question disponible pour cette catégorie.");
    return;
  }
  questionEnCours = question;
  categorieAffichee.textContent = question.categorie;
  questionTexte.textContent = question.question;

  // Fiche masquée par défaut
  ficheZone.classList.remove("visible");
  btnFiche.textContent = "📖 Fiche d'exploitation";

  // Remplir la fiche
  const f = question.fiche_exploitation || {};
  ficheReponse.textContent = f.reponse_scientifique || "—";
  ficheNotions.innerHTML = "";
  (f.notions_cles || []).forEach(function (n) {
    const li = document.createElement("li");
    li.textContent = n;
    ficheNotions.appendChild(li);
  });
  fichePistes.innerHTML = "";
  (f.pistes_debat || []).forEach(function (p) {
    const li = document.createElement("li");
    li.textContent = p;
    fichePistes.appendChild(li);
  });
  ficheRaisonnement.textContent = f.type_raisonnement || "—";

  // Démarrer le timer
  lancerTimer();
}

/* ----------- TIMER ----------- */
function lancerTimer() {
  arreterTimer();
  secondesRestantes = dureeTimer;
  majAffichageTimer();

  intervalleTimer = setInterval(function () {
    secondesRestantes--;
    majAffichageTimer();
    if (secondesRestantes <= 0) {
      arreterTimer();
    }
  }, 1000);
}

function arreterTimer() {
  if (intervalleTimer !== null) {
    clearInterval(intervalleTimer);
    intervalleTimer = null;
  }
}

function majAffichageTimer() {
  timerAffichage.textContent = Math.max(0, secondesRestantes);
  const pourcentage = Math.max(0, (secondesRestantes / dureeTimer) * 100);
  barreRemplissage.style.width = pourcentage + "%";

  // Couleurs selon temps restant
  timerAffichage.classList.remove("alerte", "fini");
  if (secondesRestantes <= 0) {
    timerAffichage.classList.add("fini");
    barreRemplissage.style.background = "var(--rouge)";
  } else if (secondesRestantes <= Math.max(5, dureeTimer * 0.2)) {
    timerAffichage.classList.add("alerte");
    barreRemplissage.style.background = "var(--orange)";
  } else {
    barreRemplissage.style.background = "var(--bleu)";
  }
}

/* ----------- ÉVÉNEMENTS ----------- */
btnDemarrer.addEventListener("click", function () {
  zoneErreur.innerHTML = "";
  categorieChoisie = selectCategorie.value;
  const valeurTimer = parseInt(inputTimer.value, 10);
  if (isNaN(valeurTimer) || valeurTimer < 5) {
    afficherErreur("Durée du timer invalide (minimum 5 secondes).");
    return;
  }
  dureeTimer = valeurTimer;

  const question = tirerQuestionAleatoire();
  if (!question) {
    afficherErreur("Aucune question disponible.");
    return;
  }

  ecranAccueil.classList.remove("actif");
  ecranQuestion.classList.add("actif");
  afficherQuestion(question);
});

btnSuivante.addEventListener("click", function () {
  const question = tirerQuestionAleatoire();
  afficherQuestion(question);
});

btnRelancerTimer.addEventListener("click", function () {
  lancerTimer();
});

btnFiche.addEventListener("click", function () {
  const visible = ficheZone.classList.toggle("visible");
  btnFiche.textContent = visible ? "🔒 Masquer la fiche" : "📖 Fiche d'exploitation";
});

btnRetour.addEventListener("click", function () {
  arreterTimer();
  ecranQuestion.classList.remove("actif");
  ecranAccueil.classList.add("actif");
});

/* ----------- INIT ----------- */
chargerDonnees();
</script>
</body>
</html>
